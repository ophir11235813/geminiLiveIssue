<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf3e6" />
    <!-- Lets "Add to Home Screen" launch full-screen with no Safari chrome,
         which is what actually eliminates the rubber-band bounce entirely
         (the CSS fixes handle in-Safari-tab use; standalone mode is the
         other half of "feels like an app"). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" = dark status bar text, correct for this light background
         (the old "black-translucent" assumed dark content underneath). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cubby" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces (headings/wordmark) + Plus Jakarta Sans (body/UI) — a
         display serif with real character paired with a clean, still-fast-
         to-read grotesque, instead of the default system-font stack. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Springhill Cubby</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
