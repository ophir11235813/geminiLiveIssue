<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0b08" />
    <!-- Lets "Add to Home Screen" launch full-screen with no Safari chrome,
         which is what actually eliminates the rubber-band bounce entirely
         (the CSS fixes handle in-Safari-tab use; standalone mode is the
         other half of "feels like an app"). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sherpa" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Springhill Sherpa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
